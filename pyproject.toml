[project]
name = "review-analysis-demo"
version = "0.1.0"
description = "Głos Klienta – analiza opinii klientów: od słownika do LLM (Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
# Computing the results and the live analysis: a machine with an NVIDIA GPU and Ollama.
# The app itself (and Docker) needs only the base dependencies.
analysis = [
    "matplotlib>=3.11.2",
    "ollama>=0.6.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "vadersentiment>=3.3.2",
]

[tool.uv]
default-groups = ["analysis"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
